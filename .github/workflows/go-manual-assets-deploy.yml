name: GO | Owner paired release
run-name: GO release ${{ inputs.release_id }} ${{ inputs.request_id }} ${{ inputs.action }}
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [start, rollback]
        required: true
      release_id:
        type: string
        required: true
      request_id:
        type: string
        required: true
      original_request_id:
        type: string
        required: false
      expected_sha:
        type: string
        required: true
      hub_sha:
        type: string
        required: true
      go_baseline:
        type: string
        required: true
      hub_baseline:
        type: string
        required: true
      confirm:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: go-hub-owner-production
  cancel-in-progress: false
env:
  RELEASE_ACTION: ${{ inputs.action }}
  RELEASE_ID: ${{ inputs.release_id }}
  RELEASE_REQUEST_ID: ${{ inputs.request_id }}
  RELEASE_ORIGINAL_REQUEST_ID: ${{ inputs.original_request_id }}
  RELEASE_GO_SHA: ${{ inputs.expected_sha }}
  RELEASE_HUB_SHA: ${{ inputs.hub_sha }}
  RELEASE_GO_BASELINE: ${{ inputs.go_baseline }}
  RELEASE_HUB_BASELINE: ${{ inputs.hub_baseline }}
  RELEASE_CONFIRM: ${{ inputs.confirm }}
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate trusted manifest and immutable source selection
        run: |
          node scripts/paired-release-runner.mjs manifest
          cp scripts/paired-release-runner.mjs "$RUNNER_TEMP/paired-release-runner.mjs"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify exact source includes the ordinary-chat controller
        run: node "$RUNNER_TEMP/paired-release-runner.mjs" source
      - name: Check routing and full GO regression
        run: |
          node scripts/assert-current-routing.mjs
          node --test --test-isolation=none tests/*.test.mjs
      - name: Build GO and assets without credentials or uploading
        run: npx --yes wrangler@4.152.0 deploy --config wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/go-build"
  production:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    environment: go-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recheck manifest from the selected workflow revision
        run: |
          node scripts/paired-release-runner.mjs manifest
          cp scripts/paired-release-runner.mjs "$RUNNER_TEMP/paired-release-runner.mjs"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Recheck immutable source
        run: node "$RUNNER_TEMP/paired-release-runner.mjs" source
      - name: Deploy and verify GO before starting Hub
        if: inputs.action == 'start'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$RUNNER_TEMP/paired-release-runner.mjs" go
      - name: Start exactly one protected manual Hub job
        if: inputs.action == 'start'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
        run: node "$RUNNER_TEMP/paired-release-runner.mjs" trigger-hub
      - name: Read bounded Hub status and verify deployed identity
        if: inputs.action == 'start'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
        run: node "$RUNNER_TEMP/paired-release-runner.mjs" wait-hub
      - name: Explicit version rollback Hub then GO after safety checks
        if: inputs.action == 'rollback'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$RUNNER_TEMP/paired-release-runner.mjs" rollback
      - name: Reconcile failure and restore only owned, binding-safe prior versions
        if: failure() && inputs.action == 'start'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$RUNNER_TEMP/paired-release-runner.mjs" recover
      - name: Retain durable nonsecret receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.release_id }}-${{ inputs.request_id }}
          path: release-receipt/
          retention-days: 30
          if-no-files-found: warn
