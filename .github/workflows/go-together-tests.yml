name: GO-Together Worker tests

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'tests/**'
      - '.github/workflows/go-together-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - '.github/workflows/go-together-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify owner-only Access and MCP compatibility
        run: node --test --test-isolation=none tests/*.test.mjs
