name: GO-Together Worker tests

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'tests/**'
      - 'scripts/**'
      - 'static/**'
      - 'wrangler.jsonc'
      - '.github/workflows/go-together-tests.yml'
      - '.github/workflows/go-manual-assets-deploy.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'tests/**'
      - 'scripts/**'
      - 'static/**'
      - 'wrangler.jsonc'
      - '.github/workflows/go-together-tests.yml'
      - '.github/workflows/go-manual-assets-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify owner-only Access and MCP compatibility
        run: node --test --test-isolation=none tests/*.test.mjs
      - name: Verify current routing and Factory approvals assets
        run: |
          node scripts/assert-current-routing.mjs
          node scripts/assert-approval-assets.mjs
      - name: Dry-run GO Worker plus static assets (no credentials or upload)
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/go-wrangler-dry-run"
