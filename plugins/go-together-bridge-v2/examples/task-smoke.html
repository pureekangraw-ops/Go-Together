<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge — ทดสอบเว็บแอป</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f8fc;color:#14324b;font:16px/1.6 system-ui}main{max-width:740px;margin:4vw auto;padding:24px}section{background:white;padding:24px;border:1px solid #c7ddea;border-radius:18px}h1{font-size:28px;margin:0 0 8px}p{color:#456277}form{display:flex;gap:12px}input{min-width:0;flex:1;padding:12px;border:1px solid #93afc3;border-radius:8px;font:inherit}button{min-height:44px;padding:10px 18px;background:#0964b5;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #dbe7ef}li span{overflow-wrap:anywhere}ul{padding:0;list-style:none}button:focus-visible,input:focus-visible{outline:3px solid #ffc849;outline-offset:3px}@media(max-width:460px){main{margin:0;padding:16px}section{padding:18px}form{flex-direction:column}h1{font-size:24px}}</style>
<main><section><h1>รายการทดลอง</h1><p>ตัวอย่างเว็บแอปสำหรับตรวจการเพิ่มและลบรายการ ข้อมูลอยู่ในหน้านี้ชั่วคราว ไม่เชื่อม GO Brain</p><form id="add"><label for="task">รายการ</label><input id="task" required maxlength="240"><button>เพิ่ม</button></form><ul id="items"></ul><p id="empty">ยังไม่มีรายการ</p><p id="status" role="status" aria-live="polite"></p></section></main>
<script>const form=document.querySelector('form'),input=document.querySelector('input'),list=document.querySelector('ul'),empty=document.querySelector('#empty'),status=document.querySelector('#status');form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text){status.textContent='กรุณาใส่ข้อความ';return}const li=document.createElement('li'),span=document.createElement('span'),button=document.createElement('button');span.textContent=text;button.textContent='ลบ';button.type='button';button.addEventListener('click',()=>{li.remove();empty.hidden=list.children.length>0;status.textContent='ลบรายการแล้ว';input.focus()});li.append(span,button);list.append(li);empty.hidden=true;input.value='';status.textContent='เพิ่มรายการแล้ว';input.focus()});</script></html>
